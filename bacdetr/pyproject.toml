[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bacdetr"
version = "2.0.0"
description = "BacDETR - Bacterial Detection Transformer (Inference Package)"
readme = "README.md"
authors = [
    {name = "Boeck Lab", email = "your-email@example.com"}
]
license = {text = "Apache License 2.0"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
keywords = ["machine-learning", "deep-learning", "vision", "DETR", "bacteria", "microscopy"]

dependencies = [
    "torch>=1.13.0",
    "torchvision>=0.14.0",
    "scipy",
    "timm",
    "numpy",
    "einops",
    "pydantic",
    "pillow",
]

[project.optional-dependencies]
viz = ["supervision"]
all = ["supervision"]

[tool.setuptools.packages.find]
include = ["bacdetr*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
bacdetr = ["py.typed", "models/backbone/dinov2_configs/*.json", "assets/*"]
